<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>モンスト反射ガイド</title><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#0b1422;color:#eef;font:14px system-ui}.app{max-width:900px;margin:auto;display:grid;gap:10px}header,.panel{background:#142238;border:1px solid #40536e;border-radius:12px;padding:12px}h2{font-size:18px;margin:0}button{background:#203750;color:white;border:1px solid #55708e;border-radius:9px;padding:10px;font-weight:bold}button.on{background:#45dfc2;color:#062c2b}.row{display:flex;gap:7px}.row>*{flex:1}.stage{width:min(100%,420px);margin:auto;position:relative;aspect-ratio:1206/2622;background:#101d30;border:1px solid #52627a}.stage img,.stage svg{position:absolute;width:100%;height:100%;inset:0}.stage img{object-fit:fill;pointer-events:none}svg{touch-action:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}input{width:100%;min-width:0;background:#0d192a;color:white;border:1px solid #52627a;padding:8px;border-radius:7px}input[type=range]{padding:0}label{display:flex;align-items:center;gap:5px}.muted{color:#a8b6ca;font-size:12px}.toggles{display:flex;gap:7px;overflow:auto}.toggles button{white-space:nowrap}.status{text-align:center;background:#101d30;padding:8px;font-size:12px}.controls{display:grid;gap:10px}@media(min-width:720px){.layout{display:grid;grid-template-columns:420px 1fr;gap:12px;align-items:start}}
</style></head><body><main class="app"><header class="row"><div><h2>モンスト 反射ガイド</h2><span class="muted">反射軌道・ブロック配置シミュレーター</span></div><label><button onclick="document.getElementById('file').click()">背景画像</button><input id="file" type="file" accept="image/*" hidden></label></header><div class="layout"><section><div class="stage"><img id="bg" hidden><svg id="svg" viewBox="0 0 1206 2622"><path id="wall" d="M44 502H1162V1762H44Z" fill="none" stroke="#50d9d5" stroke-width="3" stroke-dasharray="3 5"/><path id="band" fill="none" stroke="white" stroke-opacity=".34" stroke-width="105" stroke-linecap="round"/><path id="path" fill="none" stroke="#111" stroke-width="5"/><path id="ext" fill="none" stroke="#111" stroke-width="5"/><path id="red" fill="none" stroke="#e33" stroke-width="5"/><g id="blocks"></g><g id="marks"></g><circle id="launch" r="89.7" fill="#00b9d5" fill-opacity=".82" stroke="#087e96" stroke-width="5" stroke-dasharray="3 4"/><circle id="center" r="5" fill="white"/></svg></div><div id="status" class="status">発射点を設定してください</div></section><section class="controls"><div class="grid"><button id="pos" class="on">◎ 発射点</button><button id="ang">↗ 角度</button><button id="blk">□ ブロック</button></div><div id="hint" class="muted">画面をタップ・ドラッグして発射点を設定</div><div id="coords" class="two"><label>X<input id="x" type="number" value="591"></label><label>Y<input id="y" type="number" value="700"></label></div><div id="anglebox" class="panel" hidden><input id="slider" type="range" min="0" max="359.6484375" step=".3515625" value="63.63"><label>角度<input id="angle" type="number" value="63.63" step=".3515625">°</label><div class="row"><button data-step="-3.515625">−3.52°</button><button data-step="-.3515625">−.35°</button><button data-step=".3515625">+.35°</button><button data-step="3.515625">+3.52°</button></div></div><div id="blockbox" class="panel" hidden><div class="grid"><button id="confirm" class="on">確定</button><button id="add">追加</button><button id="del">削除</button></div><p id="blockinfo" class="muted">ブロック1を配置してください。</p><div class="two"><label>X<input id="bx" type="number"></label><label>Y<input id="by" type="number"></label></div><small>140×140px・モンスター外周で接触判定</small></div><div class="panel"><div class="row"><b>反射回数</b><b id="rv" style="text-align:right">6回</b></div><div class="row"><button id="minus">−</button><button id="plus" class="on">＋</button></div></div><div class="toggles"><button id="width" class="on">幅 ON</button><button id="outline" class="on">壁線 ON</button><button id="line">線：黒</button><button id="numbers" class="on">数字 ON</button><button id="yellow" class="on">黄色円 ON</button><button id="extension" class="on">延長線 ON</button><button id="redtoggle" class="on">赤線 ON</button></div><button id="save">配置保存</button><div id="readout" class="muted"></div></section></div></main>
<script>(()=>{const $=id=>document.getElementById(id),B={l:44,r:1162,t:502,b:1762},R=89.7,H=70,N=1024;let x=591,y=700,a=63.6328125*Math.PI/180,mode='pos',drag=false,limit=6,width=true,outline=true,white=false,numbers=true,yellow=true,extension=true,redOn=true,blocks=[],pending=null,nextId=1;const rad=v=>v*Math.PI/180,deg=v=>(v*180/Math.PI+360)%360,quant=v=>Math.round((((v%(2*Math.PI))+2*Math.PI)%(2*Math.PI))/(2*Math.PI)*N)%N*2*Math.PI/N;function pt(e){let r=$('svg').getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*1206,y:(e.clientY-r.top)/r.height*2622}}function screenDist(px,py,dx,dy){let q=Infinity;if(dx>1e-10)q=Math.min(q,(1206-px)/dx);if(dx< -1e-10)q=Math.min(q,(0-px)/dx);if(dy>1e-10)q=Math.min(q,(2622-py)/dy);if(dy< -1e-10)q=Math.min(q,(0-py)/dy);return q}function wallHit(px,py,dx,dy){let tx=dx>1e-10?(B.r-px)/dx:dx< -1e-10?(B.l-px)/dx:Infinity,ty=dy>1e-10?(B.b-py)/dy:dy< -1e-10?(B.t-py)/dy:Infinity,q=Math.min(tx,ty);if(!isFinite(q)||q<1e-7)return null;let c=Math.abs(tx-ty)<1e-7;return{t:q,x:px+dx*q,y:py+dy*q,nx:c?(dx>0?-1:1):tx<ty?(dx>0?-1:1):0,ny:c?(dy>0?-1:1):tx<ty?0:(dy>0?-1:1),wall:true}}function blockHit(px,py,dx,dy,b){let l=b.x-H-R,r=b.x+H+R,t=b.y-H-R,bt=b.y+H+R,c=[];function add(q,nx,ny,ok){if(q>1e-7&&ok)c.push({t:q,nx,ny,block:b,wall:false})}if(Math.abs(dx)>1e-10)for(let xx of [l,r]){let q=(xx-px)/dx,yy=py+dy*q;add(q,xx===l?-1:1,0,yy>=t-1e-7&&yy<=bt+1e-7)}if(Math.abs(dy)>1e-10)for(let yy of [t,bt]){let q=(yy-py)/dy,xx=px+dx*q;add(q,0,yy===t?-1:1,xx>=l-1e-7&&xx<=r+1e-7)}c.sort((u,v)=>u.t-v.t);return c[0]||null}function trace(){let px=x,py=y,dx=Math.cos(a),dy=Math.sin(a),d=`M${x} ${y}`,hits=[],segs=[];for(let i=1;i<=limit;i++){let h=wallHit(px,py,dx,dy);for(let b of blocks){let z=blockHit(px,py,dx,dy,b);if(z&&(!h||z.t<h.t))h={...z,x:px+dx*z.t,y:py+dy*z.t}}if(!h)break;segs.push({dx,dy});d+=` L${h.x} ${h.y}`;hits.push({...h,n:i});let dot=dx*h.nx+dy*h.ny;dx-=2*dot*h.nx;dy-=2*dot*h.ny;let m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;px=h.x+dx*.02;py=h.y+dy*.02}return{d,hits,segs}}function draw(){let z=trace();$('launch').setAttribute('cx',x);$('launch').setAttribute('cy',y);$('center').setAttribute('cx',x);$('center').setAttribute('cy',y);$('launch').style.display=$('center').style.display=mode==='blk'?'none':'';$('band').setAttribute('d',z.d);$('band').style.display=width?'':'none';$('path').setAttribute('d',z.d);$('path').setAttribute('stroke',white?'white':'#111');$('ext').setAttribute('d','');$('ext').style.display=extension?'':'none';$('ext').setAttribute('stroke','#111');if(z.hits.length&&z.hits[0].wall){let h=z.hits[0],s=z.segs[0],q=screenDist(h.x,h.y,s.dx,s.dy);$('ext').setAttribute('d',`M${h.x} ${h.y}L${h.x+s.dx*q} ${h.y+s.dy*q}`)}let q=screenDist(x,y,-Math.cos(a),-Math.sin(a));$('red').setAttribute('d',`M${x} ${y}L${x-Math.cos(a)*q} ${y-Math.sin(a)*q}`);$('red').style.display=redOn?'':'none';$('marks').replaceChildren();for(let h of z.hits){if(h.wall&&yellow){let c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',h.x);c.setAttribute('cy',h.y);c.setAttribute('r',13.5);c.setAttribute('fill','#ffdf27');c.setAttribute('stroke','#9b7300');c.setAttribute('stroke-width',3);$('marks').append(c)}if(h.wall&&numbers){let tx=h.x<=B.l+1?19:h.x>=B.r-1?1187:h.x,ty=h.y<=B.t+1?475:h.y>=B.b-1?1790:h.y,t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',tx);t.setAttribute('y',ty+12);t.setAttribute('font-size',34);t.setAttribute('font-weight','bold');t.setAttribute('fill','white');t.setAttribute('stroke','#333');t.setAttribute('stroke-width',3);t.setAttribute('paint-order','stroke');t.setAttribute('text-anchor','middle');t.textContent=h.n;$('marks').append(t)}}$('blocks').replaceChildren();[...blocks,...(pending?[pending]:[])].forEach(b=>{let r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',b.x-H);r.setAttribute('y',b.y-H);r.setAttribute('width',140);r.setAttribute('height',140);r.setAttribute('fill','#ff7777');r.setAttribute('fill-opacity','.48');r.setAttribute('stroke','#9e1010');r.setAttribute('stroke-width',7);if(!b.fixed)r.setAttribute('stroke-dasharray','9 6');$('blocks').append(r);let t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',b.x);t.setAttribute('y',b.y+9);t.setAttribute('font-size',30);t.setAttribute('fill','white');t.setAttribute('text-anchor','middle');t.textContent=b.id;$('blocks').append(t)});$('wall').style.display=outline?'':'none';$('x').value=Math.round(x);$('y').value=Math.round(y);let av=+deg(a).toFixed(2);$('slider').value=av;$('angle').value=av;$('rv').textContent=limit+'回';$('blockinfo').textContent=pending?`仮ブロック${pending.id}・固定済み${blocks.length}個`:`固定済みブロック${blocks.length}個`;$('bx').value=pending?Math.round(pending.x):'';$('by').value=pending?Math.round(pending.y):'';$('status').textContent=`発射 (${Math.round(x)}, ${Math.round(y)}) ・ ${av.toFixed(2)}° ・ ${z.hits.length}回`;$('readout').textContent=`角度 ${av.toFixed(2)}° ／ 反射 ${z.hits.length}回`}function setMode(m){mode=m;[['pos','pos'],['ang','ang'],['blk','blk']].forEach(([v,id])=>$(id).classList.toggle('on',m===v));$('anglebox').hidden=m!=='ang';$('blockbox').hidden=m!=='blk';$('coords').hidden=m==='blk';$('hint').textContent=m==='pos'?'タップ・ドラッグで発射点を移動':m==='ang'?'タップ・ドラッグで角度を調整':'仮ブロックをドラッグ。確定で固定、削除で仮ブロックを消去';if(m==='blk'&&!pending)pending={id:nextId++,x:375,y:1405,fixed:false};draw()}$('svg').addEventListener('pointerdown',e=>{let p=pt(e);if(mode==='blk'){if(!pending)return;pending.x=Math.max(B.l+H,Math.min(B.r-H,p.x));pending.y=Math.max(B.t+H,Math.min(B.b-H,p.y));drag=true;$('svg').setPointerCapture(e.pointerId);draw();e.preventDefault();return}if(p.x<B.l||p.x>B.r||p.y<B.t||p.y>B.b)return;if(mode==='pos'){x=p.x;y=p.y}else a=quant(Math.atan2(p.y-y,p.x-x));drag=true;$('svg').setPointerCapture(e.pointerId);draw();e.preventDefault()});$('svg').addEventListener('pointermove',e=>{if(!drag)return;let p=pt(e);if(mode==='pos'){x=Math.max(B.l,Math.min(B.r,p.x));y=Math.max(B.t,Math.min(B.b,p.y))}else if(mode==='ang')a=quant(Math.atan2(p.y-y,p.x-x));else if(pending){pending.x=Math.max(B.l+H,Math.min(B.r-H,p.x));pending.y=Math.max(B.t+H,Math.min(B.b-H,p.y))}draw();e.preventDefault()});$('svg').addEventListener('pointerup',()=>drag=false);$('svg').addEventListener('pointercancel',()=>drag=false);$('pos').onclick=()=>setMode('pos');$('ang').onclick=()=>setMode('ang');$('blk').onclick=()=>setMode('blk');['x','y'].forEach(id=>$(id).onchange=()=>{let v=+$(id).value;if(Number.isFinite(v)){if(id==='x')x=Math.max(B.l,Math.min(B.r,v));else y=Math.max(B.t,Math.min(B.b,v));draw()}});function setA(v){a=quant(rad(Math.max(0,Math.min(359.6484375,v))));draw()}$('slider').oninput=e=>setA(+e.target.value);$('angle').onchange=e=>setA(+e.target.value);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>setA(deg(a)+ +b.dataset.step));$('minus').onclick=()=>{limit=Math.max(0,limit-1);draw()};$('plus').onclick=()=>{limit=Math.min(50,limit+1);draw()};$('confirm').onclick=()=>{if(pending){pending.fixed=true;blocks.push(pending);pending=null;draw()}};$('add').onclick=()=>{if(pending){$('status').textContent='先に仮ブロックを確定してください';return}pending={id:nextId++,x:375,y:1405,fixed:false};draw()};$('del').onclick=()=>{if(pending){pending=null;draw();return}if(blocks.length){blocks.pop();draw()}};let toggles={width:'幅',outline:'壁線',numbers:'数字',yellow:'黄色円',extension:'延長線',redtoggle:'赤線'},states={width,outline,numbers,yellow,extension,redtoggle:redOn};Object.keys(toggles).forEach(id=>$(id).onclick=()=>{states[id]=!states[id];width=states.width;outline=states.outline;numbers=states.numbers;yellow=states.yellow;extension=states.extension;redOn=states.redtoggle;$(id).textContent=toggles[id]+' '+(states[id]?'ON':'OFF');$(id).classList.toggle('on',states[id]);draw()});$('line').onclick=()=>{white=!white;$('line').textContent='線：'+(white?'白':'黒');draw()};$('save').onclick=()=>{localStorage.setItem('reflectionGuideSave',JSON.stringify({x,y,a,blocks}));$('status').textContent='配置をこの端末に保存しました'};$('bx').onchange=()=>{if(pending){pending.x=Math.max(B.l+H,Math.min(B.r-H,+$('bx').value||pending.x));draw()}};$('by').onchange=()=>{if(pending){pending.y=Math.max(B.t+H,Math.min(B.b-H,+$('by').value||pending.y));draw()}};$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);$('bg').onload=()=>URL.revokeObjectURL(u);$('bg').src=u;$('bg').hidden=false};draw()})();</script></body></html>
